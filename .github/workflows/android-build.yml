name: Build Android app

# Android APK/AAB builds are manual only. This prevents every source change
# from automatically starting a long Android build.
on:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # NDK r28+ keeps native libraries compatible with Android's 16 KB
      # memory-page requirement. Cache is deliberately disabled because the
      # NDK cache can restore incomplete clang wrapper trees.
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          local-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install the Tauri CLI
        run: npm install

      - name: Initialize the Android project
        run: npx tauri android init
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # The generated Tauri Android template currently uses Kotlin 1.9.x,
      # while this project uses Google Mobile Ads 24.9.0, whose Kotlin
      # metadata is newer. That mismatch causes compileDebugKotlin to fail
      # with "binary version ... 2.2.0, expected ... 1.9.0".
      # Upgrade only the generated Android project's Kotlin Gradle Plugin
      # references to 2.2.0. Kotlin 2.2 is compatible with the Gradle 8.14
      # toolchain used by this generated project.
      - name: Align generated Android Kotlin version
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_DIR="src-tauri/gen/android"

          # Replace the generated template's Kotlin 1.9.x version wherever
          # it is declared. Do not touch application source code.
          find "$ANDROID_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.toml" \) -print0 \
            | xargs -0 sed -i -E 's/(["'"''])1\.9\.[0-9]+(["'"''])/\12.2.0\2/g'

          echo "Kotlin version references after alignment:"
          grep -RInE 'kotlin.*2\.2\.0|2\.2\.0.*kotlin' "$ANDROID_DIR" --include='*.gradle' --include='*.gradle.kts' --include='*.toml' || true

      - name: Generate app icons from source artwork
        run: npx tauri icon icon-source/app-icon-1024.png

      # Force the Android API level required for new/updated apps.
      - name: Ensure compileSdk/targetSdk 36
        run: |
          sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 36/' src-tauri/gen/android/app/build.gradle.kts
          sed -i -E 's/targetSdk\s*=\s*[0-9]+/targetSdk = 36/' src-tauri/gen/android/app/build.gradle.kts

      - name: Build debug APK (unsigned, for sideloading/testing)
        run: npx tauri android build --apk --debug
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DD-Compressor-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Release builds require the four signing secrets. If they are not
      # configured, only the debug APK above is produced.
      - name: Set up release signing
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/release.keystore
          cat > src-tauri/gen/android/keystore.properties << PROPS
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeFile=release.keystore
          PROPS

      - name: Build signed release (AAB + APK)
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          npx tauri android build --aab
          npx tauri android build --apk

      - name: Upload signed release artifacts
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: DD-Compressor-release
          path: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
